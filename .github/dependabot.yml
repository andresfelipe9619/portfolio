version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '⬆️ chore'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 5
    # Five separate PRs for five patch bumps is five CI runs and five reviews.
    # Grouping keeps the queue readable and the signal high.
    #
    # Order matters: Dependabot puts each dependency in the *first* group that
    # matches it. The named groups used to come after the catch-alls, so the
    # catch-alls claimed every minor and patch bump and react/radix/tooling
    # only ever saw majors. Specific groups go first now; the catch-alls
    # sweep up whatever is left. Majors outside the named groups still arrive
    # as individual PRs, which is where a breaking change deserves to be.
    groups:
      # Always move together — mismatched react/react-dom versions break.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      radix:
        patterns:
          - '@radix-ui/*'
      tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - '@eslint-community/*'
          - 'typescript-eslint'
          - 'prettier*'
          - 'vite'
          - 'vitest'
          - '@vitest/*'
          - '@playwright/test'
      production-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '⬆️ chore'
    labels:
      - 'dependencies'
    groups:
      actions:
        patterns:
          - '*'

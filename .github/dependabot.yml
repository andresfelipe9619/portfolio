version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '⬆️ chore'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 5
    # Five separate PRs for five patch bumps is five CI runs and five reviews.
    # Grouping keeps the queue readable and the signal high.
    groups:
      production-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      radix:
        patterns:
          - '@radix-ui/*'
      tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier*'
          - 'vite'
          - 'vitest'
          - '@vitest/*'
          - '@playwright/test'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '⬆️ chore'
    labels:
      - 'dependencies'
    groups:
      actions:
        patterns:
          - '*'

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🔥 Branding -->
    <!--
      No <title>, description or canonical here on purpose: each route renders
      its own via <Seo>, and React 19 would add those next to any static ones
      rather than replacing them. See src/components/seo.tsx.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- 🪄 SEO Meta -->
    <meta
      name="keywords"
      content="Software & Solutions Engineer, Senior Software Engineer, Node.js, TypeScript, AWS, SaaS, Cloud Architecture, Automation, Open Source, Portfolio"
    />
    <meta name="author" content="Andrés Suárez" />

    <!-- 📱 Social / Open Graph — the site-wide card. Social crawlers don't run JS,
         so this is the only version they will ever see. -->
    <meta
      property="og:title"
      content="Andrés Suárez – Senior Software &amp; Solutions Engineer"
    />
    <meta
      property="og:description"
      content="Global companies trust me to build what others can’t. 9+ years, 30+ projects, 12 countries — cloud, automation and SaaS."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://portfolio-lake-nine-unco625inq.vercel.app"
    />
    <meta
      property="og:image"
      content="https://portfolio-lake-nine-unco625inq.vercel.app/og-card.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Andrés Suárez, Senior Software &amp; Solutions Engineer"
    />
    <meta property="og:site_name" content="Andrés Suárez" />

    <!-- 🐦 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Andrés Suárez – Senior Software &amp; Solutions Engineer"
    />
    <meta
      name="twitter:description"
      content="Global companies trust me to build what others can’t."
    />
    <meta
      name="twitter:image"
      content="https://portfolio-lake-nine-unco625inq.vercel.app/og-card.jpg"
    />

    <!-- 🔍 Search Engines -->
    <link
      rel="sitemap"
      type="application/xml"
      title="Sitemap"
      href="/sitemap.xml"
    />

    <!-- ✅ Security -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Andrés Suárez",
        "url": "https://portfolio-lake-nine-unco625inq.vercel.app",
        "image": "https://portfolio-lake-nine-unco625inq.vercel.app/me.jpeg",
        "sameAs": [
          "https://github.com/andresfelipe9619",
          "https://www.linkedin.com/in/suarezdev96/"
        ],
        "jobTitle": "Senior Software & Solutions Engineer",
        "description": "Global companies trust me to build what others can’t. Software & Solutions Engineer · Systems Thinker · Open Source Builder."
      }
    </script>

    <!--
      Analytics (Clarity, GA) now boot from src/lib/, gated on env vars and on
      visitor consent. No inline scripts here means a strict CSP can stay strict.
    -->

    <!-- 🧩 App -->
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
